[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feynman-mcp"
version = "0.1.0"
description = "MCP server that lets any AI play a curious newbie: you teach it a concept by voice + drawing/whiteboard, it probes, flags misconceptions, and writes a report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
feynman-mcp = "feynman_mcp.server:main"

[tool.setuptools]
packages = ["feynman_mcp"]

[tool.setuptools.package-data]
feynman_mcp = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
